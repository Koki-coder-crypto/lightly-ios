name: QR控え帳
options:
  bundleIdPrefix: jp.egawa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: 5.0
targets:
  QR控え帳:
    type: application
    platform: iOS
    sources: [Sources, ../Shared, Assets.xcassets]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.egawa.qrkeeper
        INFOPLIST_KEY_CFBundleDisplayName: "QR控え帳"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: "QRコードを読み取り、用途と期限を控えるためにカメラを使用します。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
