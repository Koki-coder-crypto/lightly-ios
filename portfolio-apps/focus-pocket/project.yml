name: 集中ポケット
options:
  bundleIdPrefix: jp.egawa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  集中ポケット:
    type: application
    platform: iOS
    sources: [Sources, ../Shared, Assets.xcassets]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.egawa.focuspocket
        INFOPLIST_KEY_CFBundleDisplayName: "集中ポケット"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
