name: 手渡しプリント
options:
  bundleIdPrefix: jp.egawa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.0
targets:
  手渡しプリント:
    type: application
    platform: iOS
    sources: [Sources, ../Shared, Assets.xcassets]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.egawa.handyprint
        INFOPLIST_KEY_CFBundleDisplayName: "手渡しプリント"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "選択した写真から印刷用PDFを作成するために写真ライブラリを使用します。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
