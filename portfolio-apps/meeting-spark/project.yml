name: 会議前メモ
options:
  bundleIdPrefix: jp.egawa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  会議前メモ:
    type: application
    platform: iOS
    sources: [Sources, ../Shared, Assets.xcassets]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.egawa.meetingspark
        INFOPLIST_KEY_CFBundleDisplayName: "会議前メモ"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "会議前の短い音声メモを端末内に録音するためにマイクを使用します。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
