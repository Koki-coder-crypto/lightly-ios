name: PixaTidy Cleaner iOS

on:
  pull_request:
    paths: [portfolio-apps/room-roll/**, portfolio-apps/Shared/**, .github/workflows/room-roll.yml]
  push:
    branches: [master]
    paths: [portfolio-apps/room-roll/**, portfolio-apps/Shared/**, .github/workflows/room-roll.yml]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "TestFlightへ送信する"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-26
    defaults: { run: { working-directory: portfolio-apps/room-roll } }
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build without signing
        if: ${{ !inputs.upload_testflight }}
        run: xcodebuild -project RoomRoll.xcodeproj -scheme RoomRoll -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Import distribution certificate and App Store profile
        if: ${{ inputs.upload_testflight }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ROOMROLL_PROFILE_BASE64: ${{ secrets.ROOMROLL_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ROOMROLL_PROFILE_BASE64" || { echo "Missing ROOMROLL_PROFILE_BASE64 secret."; exit 1; }
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > certificate.p12
          echo "$ROOMROLL_PROFILE_BASE64" | base64 -D > profile.mobileprovision
          security create-keychain -p "$P12_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$P12_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive and export IPA
        if: ${{ inputs.upload_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ROOMROLL_PROFILE_NAME: ${{ secrets.ROOMROLL_PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$ROOMROLL_PROFILE_NAME" || { echo "Missing ROOMROLL_PROFILE_NAME secret."; exit 1; }
          xcodebuild -project RoomRoll.xcodeproj -scheme RoomRoll -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/RoomRoll.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$ROOMROLL_PROFILE_NAME" archive
          xcodebuild -exportArchive -archivePath "$PWD/build/RoomRoll.xcarchive" -exportOptionsPlist ../../ci/RoomRollExportOptions.plist -exportPath "$PWD/build/export"
      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          xcrun altool --upload-app --type ios --file "$PWD/build/export/RoomRoll.ipa" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
