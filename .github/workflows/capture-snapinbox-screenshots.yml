name: Capture SnapInbox Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    defaults:
      run:
        working-directory: portfolio-apps/room-roll
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and capture the real app
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_TYPE="$(xcrun simctl list devicetypes | sed -n 's/.*\(com.apple.CoreSimulator.SimDeviceType.iPhone-.*Pro-Max\).*/\1/p' | tail -1)"
          test -n "$DEVICE_TYPE"
          RUNTIME="$(xcrun simctl list runtimes | sed -n 's/.*\(com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*\).*/\1/p' | tail -1)"
          test -n "$RUNTIME"
          UDID="$(xcrun simctl create SnapInboxStoreShots "$DEVICE_TYPE" "$RUNTIME")"
          trap 'xcrun simctl delete "$UDID" || true' EXIT
          xcrun simctl boot "$UDID"
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project SnapInbox.xcodeproj -scheme SnapInbox -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$(find "$PWD" -path '*Build/Products/Debug-iphonesimulator/SnapInbox.app' -print -quit)"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" jp.egawa.roomroll
          sleep 4
          mkdir -p "$GITHUB_WORKSPACE/store-screenshots"
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/store-screenshots/SnapInbox-01.png"
          sips -z 2778 1284 "$GITHUB_WORKSPACE/store-screenshots/SnapInbox-01.png" --out "$GITHUB_WORKSPACE/store-screenshots/SnapInbox-01-6.5.png"
      - uses: actions/upload-artifact@v4
        with:
          name: snapinbox-store-screenshots
          path: store-screenshots/SnapInbox-01-6.5.png
