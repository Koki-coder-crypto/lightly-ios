name: Capture SnapInbox Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    defaults:
      run:
        working-directory: portfolio-apps/room-roll
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and capture the real app
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project SnapInbox.xcodeproj -scheme SnapInbox -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$PWD/build/DerivedData/Build/Products/Debug-iphonesimulator/SnapInbox.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" jp.egawa.roomroll
          sleep 4
          mkdir -p "$GITHUB_WORKSPACE/store-screenshots"
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/store-screenshots/SnapInbox-01.png"
          sips -z 2778 1284 "$GITHUB_WORKSPACE/store-screenshots/SnapInbox-01.png" --out "$GITHUB_WORKSPACE/store-screenshots/SnapInbox-01-6.5.png"
      - uses: actions/upload-artifact@v4
        with:
          name: snapinbox-store-screenshots
          path: store-screenshots/SnapInbox-01-6.5.png
