name: Portfolio TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'release/portfolio-upload.trigger'

jobs:
  upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frame-drop
            directory: frame-drop
            scheme: FrameDrop
            bundle_id: jp.egawa.framedrop
          - app: qr-keeper
            directory: qr-keeper
            scheme: QR控え帳
            bundle_id: jp.egawa.qrkeeper
          - app: handy-print
            directory: handy-print
            scheme: 手渡しプリント
            bundle_id: jp.egawa.handyprint
          - app: meeting-spark
            directory: meeting-spark
            scheme: 会議前メモ
            bundle_id: jp.egawa.meetingspark
          - app: focus-pocket
            directory: focus-pocket
            scheme: 集中ポケット
            bundle_id: jp.egawa.focuspocket
    runs-on: macos-26
    permissions:
      contents: read
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Import distribution certificate
        shell: bash
        run: |
          set -euo pipefail
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > certificate.p12
          security create-keychain -p "$P12_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$P12_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain
      - name: Configure App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
      - name: Archive and export IPA
        shell: bash
        env:
          APP_DIR: ${{ matrix.directory }}
          SCHEME: ${{ matrix.scheme }}
          BUNDLE_ID: ${{ matrix.bundle_id }}
          APP_TARGET: ${{ matrix.app }}
        run: |
          set -euo pipefail
          cd "portfolio-apps/$APP_DIR"
          xcodegen generate
          xcodebuild -project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Release \
            -archivePath "$PWD/build/$APP_TARGET.xcarchive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" archive
          EXPORT_OPTIONS="$PWD/build/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive -archivePath "$PWD/build/$APP_TARGET.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" -exportPath "$PWD/build/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
      - name: Upload to TestFlight
        shell: bash
        env:
          APP_DIR: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "portfolio-apps/$APP_DIR/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
