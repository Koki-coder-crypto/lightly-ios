name: Portfolio TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to upload to TestFlight"
        required: true
        type: choice
        options:
          - frame-drop
          - qr-keeper
          - handy-print
          - meeting-spark
          - focus-pocket
          - warranty-ledger
          - leave-check
          - receipt-split
          - parcel-note
          - wifi-notes
          - home-care
  repository_dispatch:
    types: [portfolio-testflight-upload]

jobs:
  upload:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      APP_TARGET: ${{ inputs.app || github.event.client_payload.app }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Select app
        shell: bash
        run: |
          set -euo pipefail
          case "$APP_TARGET" in
            frame-drop) APP_DIR=frame-drop; SCHEME=FrameDrop; BUNDLE_ID=jp.egawa.framedrop; APP_NAME=FrameDrop; APP_SKU=framedrop-ios-001 ;;
            qr-keeper) APP_DIR=qr-keeper; SCHEME='QR控え帳'; BUNDLE_ID=jp.egawa.qrkeeper; APP_NAME='QR Keeper'; APP_SKU=qrkeeper-ios-001 ;;
            handy-print) APP_DIR=handy-print; SCHEME='手渡しプリント'; BUNDLE_ID=jp.egawa.handyprint; APP_NAME='Handy Print'; APP_SKU=handyprint-ios-001 ;;
            meeting-spark) APP_DIR=meeting-spark; SCHEME='会議前メモ'; BUNDLE_ID=jp.egawa.meetingspark; APP_NAME='Meeting Spark'; APP_SKU=meetingspark-ios-001 ;;
            focus-pocket) APP_DIR=focus-pocket; SCHEME='集中ポケット'; BUNDLE_ID=jp.egawa.focuspocket; APP_NAME='Focus Pocket'; APP_SKU=focuspocket-ios-001 ;;
            warranty-ledger) APP_DIR=warranty-ledger; SCHEME='持ち物期限帳'; BUNDLE_ID=jp.egawa.warrantyledger; APP_NAME='Warranty Ledger'; APP_SKU=warrantyledger-ios-001 ;;
            leave-check) APP_DIR=leave-check; SCHEME='出発チェック'; BUNDLE_ID=jp.egawa.leavecheck; APP_NAME='Leave Check'; APP_SKU=leavecheck-ios-001 ;;
            receipt-split) APP_DIR=receipt-split; SCHEME='Receipt Split'; BUNDLE_ID=jp.egawa.receiptsplit; APP_NAME='Receipt Split'; APP_SKU=receiptsplit-ios-001 ;;
            parcel-note) APP_DIR=parcel-note; SCHEME='荷物メモ'; BUNDLE_ID=jp.egawa.parcelnote; APP_NAME='Parcel Note'; APP_SKU=parcelnote-ios-001 ;;
            wifi-notes) APP_DIR=wifi-notes; SCHEME='Wi-Fiメモ'; BUNDLE_ID=jp.egawa.wifinotes; APP_NAME='Wi-Fi Notes'; APP_SKU=wifinotes-ios-001 ;;
            home-care) APP_DIR=home-care; SCHEME='おうちメンテ'; BUNDLE_ID=jp.egawa.homecare; APP_NAME='Home Care'; APP_SKU=homecare-ios-001 ;;
            *) echo "Unknown app: $APP_TARGET"; exit 1 ;;
          esac
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_SKU=$APP_SKU" >> "$GITHUB_ENV"
      - name: Import distribution certificate and App Store profile
        shell: bash
        run: |
          set -euo pipefail
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > certificate.p12
          security create-keychain -p "$P12_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$P12_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain
          security find-certificate -p -c "Apple Distribution" build.keychain > distribution.pem
          CERTIFICATE_SERIAL="$(openssl x509 -in distribution.pem -noout -serial | cut -d= -f2)"
          test -n "$CERTIFICATE_SERIAL"
          echo "CERTIFICATE_SERIAL=$CERTIFICATE_SERIAL" >> "$GITHUB_ENV"
      - name: Create App Store record and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appstoreconnect" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/appstoreconnect/AuthKey_$APPSTORE_KEY_ID.p8"
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/appstoreconnect/AuthKey_$APPSTORE_KEY_ID.p8"
          ruby ci/provision_portfolio_app.rb
          test -s profile.mobileprovision
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive and export IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "portfolio-apps/$APP_DIR"
          xcodegen generate
          xcodebuild -project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/$APP_TARGET.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          EXPORT_OPTIONS="$PWD/build/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive -archivePath "$PWD/build/$APP_TARGET.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" -exportPath "$PWD/build/export"
      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          IPA_PATH="$(find "portfolio-apps/$APP_DIR/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
