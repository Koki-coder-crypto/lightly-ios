name: Caliqo App Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Caliqo
        run: |
          xcodegen generate
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcodebuild -project Caliqo.xcodeproj -scheme Caliqo -sdk iphonesimulator -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO build
      - name: Capture native-resolution screenshots
        run: |
          mkdir -p screenshots
          for TAB in home ruler level history; do
            xcrun simctl terminate "$SIMULATOR_ID" jp.egawa.caliqo || true
            xcrun simctl launch "$SIMULATOR_ID" jp.egawa.caliqo -caliqoTab "$TAB"
            sleep 2
            xcrun simctl io "$SIMULATOR_ID" screenshot "screenshots/Caliqo-$TAB.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: caliqo-native-app-store-screenshots
          path: screenshots/*.png
