name: App Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and launch Lightly in the iPhone simulator
        run: |
          xcodegen generate
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b -t 120
          xcodebuild -project Lightly.xcodeproj -scheme Lightly -sdk iphonesimulator -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl launch booted jp.egawa.lightly
          sleep 3
      - name: Capture App Store screenshot
        run: |
          mkdir -p screenshots
          xcrun simctl io booted screenshot screenshots/Lightly-home-original.png
          sips --resampleHeightWidth 2778 1284 screenshots/Lightly-home-original.png --out screenshots/Lightly-home.png
          rm screenshots/Lightly-home-original.png
      - uses: actions/upload-artifact@v4
        with:
          name: lightly-app-store-screenshots
          path: screenshots/Lightly-home.png
