name: Portfolio iOS

on:
  push:
    branches: [master]
    paths: ["portfolio-apps/Shared/**", "portfolio-apps/frame-drop/**", "portfolio-apps/qr-keeper/**", "portfolio-apps/handy-print/**", "portfolio-apps/meeting-spark/**", "portfolio-apps/focus-pocket/**", ".github/workflows/portfolio-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frame-drop
            scheme: FrameDrop
          - app: qr-keeper
            scheme: QR控え帳
          - app: handy-print
            scheme: 手渡しプリント
          - app: meeting-spark
            scheme: 会議前メモ
          - app: focus-pocket
            scheme: 集中ポケット
    defaults:
      run:
        working-directory: portfolio-apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project "${{ matrix.scheme }}.xcodeproj" -scheme "${{ matrix.scheme }}" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
