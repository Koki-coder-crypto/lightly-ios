name: iOS

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "TestFlightへ送信する"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build without signing
        if: ${{ !inputs.upload_testflight }}
        run: xcodebuild -project Lightly.xcodeproj -scheme Lightly -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Import signing certificate and provisioning profile
        if: ${{ inputs.upload_testflight }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > certificate.p12
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > profile.mobileprovision
          security create-keychain -p "$P12_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$P12_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive and export IPA
        if: ${{ inputs.upload_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          xcodebuild -project Lightly.xcodeproj -scheme Lightly -configuration Release -archivePath "$PWD/build/Lightly.xcarchive" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          xcodebuild -exportArchive -archivePath "$PWD/build/Lightly.xcarchive" -exportOptionsPlist ci/ExportOptions.plist -exportPath "$PWD/build/export"
      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          xcrun altool --upload-app --type ios --file "$PWD/build/export/Lightly.ipa" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
